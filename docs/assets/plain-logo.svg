<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Emerald / Cyber Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00f2fe" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Base: Rounded Square -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />
  
  <!-- Subtle Internal Grid / Circuit Details -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#334155" stroke-width="1" opacity="0.3" />

  <!-- Outer Glow Arc -->
  <path d="M 120 380 A 180 180 0 0 1 380 130" fill="none" stroke="url(#neonGrad)" stroke-width="3" opacity="0.3" filter="url(#glowFilter)" />

  <!-- PLAIN Monogram Logo: Stylized "P" with Terminal Prompt Chevron & AI Neural Node -->
  <!-- 1. The P Stem (Vertical Pillar) -->
  <rect x="136" y="128" width="56" height="256" rx="28" fill="url(#neonGrad)" filter="url(#softShadow)" />

  <!-- 2. The P Loop (Upper Geometric Arch) -->
  <path d="M 164 128 L 290 128 C 356 128 400 172 400 236 C 400 300 356 344 290 344 L 164 344" 
        fill="none" stroke="url(#neonGrad)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 3. Terminal Prompt / Chevron Inside PLAIN Loop -->
  <path d="M 230 206 L 270 236 L 230 266" 
        fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

  <!-- 4. Modern Cyber Accent Node at bottom right of P Loop -->
  <circle cx="340" cy="236" r="14" fill="url(#accentGrad)" filter="url(#glowFilter)" />
  <circle cx="340" cy="236" r="6" fill="#ffffff" />
</svg>
